name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc build (glibc >= 2.17 via cargo-zigbuild): ~20% faster than musl at 16 threads.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zig: true
          # fully static fallback for any Linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # mimalloc (musl builds only) compiles C code: use the musl C compiler.
      - name: Install musl-gcc
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p iqrs --target ${{ matrix.target }}
      - name: Build (glibc 2.17)
        if: matrix.zig
        run: cargo zigbuild --release --locked -p iqrs --target ${{ matrix.target }}.2.17
      - name: Smoke test
        run: target/${{ matrix.target }}/release/iqrs --version
      - name: Package
        shell: bash
        run: |
          name="iqrs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/iqrs" README.md LICENSE NOTICE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: iqrs-${{ matrix.target }}
          path: iqrs-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "iqrs $GITHUB_REF_NAME" --generate-notes
